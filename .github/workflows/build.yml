name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]

jobs:
  build-linux:
    name: build-linux
    runs-on: ubuntu-latest
    container: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest

    env:
      DEPS: ${{ github.workspace }}/deps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clone dependencies
        run: |
          mkdir -p "$DEPS"
          git clone --depth 1 https://github.com/alliedmodders/hl2sdk-manifests hl2sdk-manifests
          git clone --depth 1 --branch tf2 https://github.com/alliedmodders/hl2sdk "$DEPS/hl2sdk-tf2"
          git clone --depth 1 --recursive --branch k/sourcehook_alternative https://github.com/alliedmodders/sourcemod "$DEPS/sourcemod"
          git clone --depth 1 --recursive --branch k/sourcehook_alternative https://github.com/alliedmodders/metamod-source "$DEPS/metamod-source"

      - name: Configure
        run: |
          mkdir build
          cd build
          python3 ../configure.py \
            --enable-optimize \
            --targets=x86,x86_64 \
            --sm-path="$DEPS/sourcemod" \
            --mms-path="$DEPS/metamod-source" \
            --hl2sdk-root="$DEPS"

      - name: Build
        working-directory: build
        run: ambuild

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: tf2items-linux
          path: build/package/
          if-no-files-found: error

  build-windows:
    name: build-windows
    runs-on: windows-latest

    env:
      DEPS: ${{ github.workspace }}/deps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install AMBuild
        run: |
          python -m pip install --upgrade pip wheel
          pip install git+https://github.com/alliedmodders/ambuild

      - name: Clone dependencies
        shell: bash
        run: |
          mkdir -p "$DEPS"
          git clone --depth 1 https://github.com/alliedmodders/hl2sdk-manifests hl2sdk-manifests
          git clone --depth 1 --branch tf2 https://github.com/alliedmodders/hl2sdk "$DEPS/hl2sdk-tf2"
          git clone --depth 1 --recursive --branch k/sourcehook_alternative https://github.com/alliedmodders/sourcemod "$DEPS/sourcemod"
          git clone --depth 1 --recursive --branch k/sourcehook_alternative https://github.com/alliedmodders/metamod-source "$DEPS/metamod-source"

      - name: Configure
        shell: bash
        run: |
          mkdir build
          cd build
          python ../configure.py \
            --enable-optimize \
            --targets=x86,x86_64 \
            --sm-path="$DEPS/sourcemod" \
            --mms-path="$DEPS/metamod-source" \
            --hl2sdk-root="$DEPS"

      - name: Build
        working-directory: build
        run: ambuild

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: tf2items-windows
          path: build/package/
          if-no-files-found: error

  release:
    name: release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: tf2items-*
          path: dist
          merge-multiple: true

      - name: Create archive
        run: |
          cd dist
          zip -r "../tf2items-${GITHUB_REF_NAME}.zip" addons

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "tf2items-${GITHUB_REF_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
